
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - CRZSPY</title>
    <link rel="stylesheet" href="/spck/css/sign.css">
</head>
<body>

    <div class="auth-container">
        <div class="auth-box">
            <a href="signin.html" class="logo">CRZ<span>SPY</span></a>

            <h1>Tạo tài khoản</h1>
            <p>Tham gia thế giới âm nhạc CRZSPY</p>

            <form id="registerForm">
                <label>Tên người dùng</label>
                <input type="text" id="username"
                       placeholder="Nhập tên người dùng" required>

                <label>Email</label>
                <input type="email" id="email"
                       placeholder="Nhập email" required>

                <label>Mật khẩu</label>
                <input type="password" id="password"
                       placeholder="Nhập mật khẩu" minlength="8" required>

                <label>Xác nhận mật khẩu</label>
                <input type="password" id="confirmPassword"
                       placeholder="Nhập lại mật khẩu" required>

                <p id="message"></p>

                <button type="submit">Đăng ký</button>
            </form>

            <div class="auth-link">
                Đã có tài khoản?
                <a href="signin.html">Đăng nhập</a>
            </div>
        </div>
    </div>

    <script src="/spck/js/sign.js"></script>
</body>
</html>
