<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập | CRZSPY</title>
    <link rel="stylesheet" href="sign.css">
</head>
<body>
    <header class="auth-header">
        <a href="sign.html" class="logo">CRZ<span>SPY</span></a>
        <span class="header-text">Your music, your world.</span>
    </header>

    <main class="auth-container">
        <section class="auth-card">
            <div class="brand-icon">♫</div>

            <h1 id="formTitle">Chào mừng trở lại</h1>
            <p class="subtitle" id="formSubtitle">
                Đăng nhập để tiếp tục nghe nhạc
            </p>

            <div class="tab-buttons">
                <button type="button" id="loginTab" class="tab active">
                    Đăng nhập
                </button>
                <button type="button" id="registerTab" class="tab">
                    Đăng ký
                </button>
            </div>

            <form id="authForm">
                <div class="form-group" id="usernameGroup" hidden>
                    <label for="username">Tên người dùng</label>
                    <input
                        type="text"
                        id="username"
                        placeholder="Nhập tên người dùng"
                        minlength="3"
                        maxlength="30"
                        autocomplete="username"
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="example@email.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Mật khẩu</label>
                    <div class="password-wrap">
                        <input
                            type="password"
                            id="password"
                            placeholder="Nhập mật khẩu"
                            minlength="8"
                            autocomplete="current-password"
                            required
                        >
                        <button
                            type="button"
                            class="toggle-password"
                            data-target="password"
                        >Hiện</button>
                    </div>
                </div>

                <div class="form-group" id="confirmGroup" hidden>
                    <label for="confirmPassword">Xác nhận mật khẩu</label>
                    <div class="password-wrap">
                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Nhập lại mật khẩu"
                            minlength="8"
                            autocomplete="new-password"
                        >
                        <button
                            type="button"
                            class="toggle-password"
                            data-target="confirmPassword"
                        >Hiện</button>
                    </div>
                </div>

                <p id="authMessage" class="message" role="status"
                   aria-live="polite"></p>

                <button type="submit" id="submitButton" class="submit-button">
                    Đăng nhập
                </button>
            </form>

            <p class="switch-text">
                <span id="switchPrompt">Chưa có tài khoản?</span>
                <button type="button" id="switchButton">Đăng ký ngay</button>
            </p>
        </section>
    </main>

    <footer class="auth-footer">
        © 2026 CRZSPY — Listen to your vibe.
    </footer>

    <script src="sign.js"></script>
</body>
</html>
