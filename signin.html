<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - CRZSPY</title>
    <link rel="stylesheet" href="/spck/css/sign.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <a href="signin.html" class="logo">CRZ<span>SPY</span></a>

            <h1>Đăng nhập</h1>
            <p>Chào mừng bạn quay trở lại!</p>

            <form id="loginForm">
                <label>Email</label>
                <input type="email" id="email" placeholder="Nhập email" required>

                <label>Mật khẩu</label>
                <input type="password" id="password"
                       placeholder="Nhập mật khẩu" required>

                <p id="message"></p>

                <button type="submit">Đăng nhập</button>
            </form>

            <div class="auth-link">
                Chưa có tài khoản?
                <a href="signup.html">Đăng ký ngay</a>
            </div>
        </div>
    </div>

    <script src="/spck/js/sign.js"></script>
</body>
</html>
